services:
  opencode:
    image: ghcr.io/icco/opencode-server:main
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      # The entrypoint requires exactly one password source before opening a port.
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-}
      OPENCODE_PASSWORD_FILE: ${OPENCODE_PASSWORD_FILE:-}
      OPENCODE_PUBLIC_URL: ${OPENCODE_PUBLIC_URL:-http://localhost:4096}
      OPENCODE_TRUSTED_PROXIES: ${OPENCODE_TRUSTED_PROXIES:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENCODE_GEMINI_PROJECT_ID: ${OPENCODE_GEMINI_PROJECT_ID:-}
      LUNCHMONEY_API_TOKEN: ${LUNCHMONEY_API_TOKEN:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    ports:
      - 127.0.0.1:4096:4096
    volumes:
      - data:/data
      - type: bind
        source: ${HOME}/.ssh
        target: /data/.ssh
        read_only: true
        bind:
          create_host_path: false
volumes:
  data:
