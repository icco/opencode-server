name: Test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          sh -n entrypoint.sh
          sh -n healthcheck.sh
          bash -n scripts/smoke-test.sh
          shellcheck entrypoint.sh healthcheck.sh scripts/smoke-test.sh
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Validate V2 configuration and upstream routing
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --no-optional
          pnpm test
      - name: Validate Compose
        env:
          OPENCODE_SERVER_PASSWORD: validation-only-not-a-deployment-password
        run: docker compose config --quiet
