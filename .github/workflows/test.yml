name: Test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          sh -n entrypoint.sh
          sh -n healthcheck.sh
          bash -n scripts/smoke-test.sh
          shellcheck entrypoint.sh healthcheck.sh scripts/smoke-test.sh
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Validate V2 configuration and workflow
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --no-optional
          pnpm test
      - name: Validate Compose
        env:
          OPENCODE_PASSWORD: validation-only-not-a-deployment-password
          OPENCHAMBER_UI_PASSWORD: validation-only-not-a-deployment-password
        run: docker compose config --quiet
